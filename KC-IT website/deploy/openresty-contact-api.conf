# Put this inside the server block for kelleycomputers-it.com.
# It keeps OpenResty serving the static site, while forwarding
# form submissions to the local Node contact API.

location = /server.js {
    return 404;
}

location ^~ /submissions/ {
    return 404;
}

location ^~ /deploy/ {
    return 404;
}

location = /api/contact/ {
    return 308 /api/contact;
}

location = /api/contact {
    client_max_body_size 16k;
    limit_except POST OPTIONS {
        deny all;
    }
    proxy_pass http://127.0.0.1:3000/api/contact;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optional: if OpenResty is serving the HTML files directly and you want
# clean URLs like /contact-development instead of /contact-development.html.
location / {
    try_files $uri $uri.html $uri/ =404;
}
