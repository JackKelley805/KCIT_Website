<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | KC-IT</title>
  <meta
    name="description"
    content="Contact Kelley Computers for basic business IT support and managed network services."
  >
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://kelleycomputers-it.com/contact">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kelley Computers">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://kelleycomputers-it.com/contact">
  <meta property="og:title" content="Contact Kelley Computers">
  <meta property="og:description" content="Contact Kelley Computers for basic computer support or professionally managed business networks.">
  <meta property="og:image" content="https://kelleycomputers-it.com/assets/kcit-social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Abstract connected business network in Kelley Computers blue and gold colors">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact Kelley Computers">
  <meta name="twitter:description" content="Contact Kelley Computers for basic computer support or professionally managed business networks.">
  <meta name="twitter:image" content="https://kelleycomputers-it.com/assets/kcit-social-card.png">
  <link rel="icon" type="image/png" href="assets/kc_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
</head>
<body data-page="contact">
  <canvas class="site-canvas" aria-hidden="true"></canvas>
  <div data-site-header></div>

  <main class="page-content">
    <section class="section page-hero">
      <div class="page-hero-grid">
        <div class="page-hero-copy">
          <p class="eyebrow">Contact Us!</p>
          <h1>Leave the basics and start the conversation.</h1>
          <p class="lead">
            Fill out your name, occupation, and phone number. You can also add a short note about what
            you want help with and we will be in contact as soon as possible.
          </p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="contact-grid">
        <form class="panel contact-form" data-contact-form novalidate>
          <div class="section-heading section-heading--compact">
            <p class="eyebrow">Contact form</p>
            <h2>Request a callback</h2>
          </div>

          <div class="form-grid">
            <label class="field">
              <span>Name</span>
              <input type="text" name="name" autocomplete="name" placeholder="Your full name" required>
            </label>

            <label class="field">
              <span>Occupation</span>
              <input type="text" name="occupation" placeholder="Owner, office manager, IT lead..." required>
            </label>

            <label class="field">
              <span>Phone number</span>
              <input
                type="tel"
                name="phone"
                inputmode="tel"
                autocomplete="tel"
                placeholder="(555) 123-4567"
                pattern="^[0-9+() -]{7,}$"
                required
              >
            </label>

            <label class="field">
              <span>Service needed</span>
              <select name="service">
                <option value="Business IT">Business IT</option>
                <option value="Managed Networks">Managed Networks</option>
                <option value="Business IT + Managed Networks">Business IT + Managed Networks</option>
              </select>
            </label>

            <label class="field field--full">
              <span>Notes</span>
              <textarea name="notes" rows="5" placeholder="What would you like help with?"></textarea>
            </label>
          </div>

          <div class="form-actions">
            <button class="button button--primary" type="submit">Save request</button>
          </div>

          <div class="form-status" data-form-status hidden></div>
        </form>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
